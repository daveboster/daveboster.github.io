<style>
.site-shot{max-width:640px;margin:1.75rem auto .5rem;border-radius:12px;overflow:hidden;border:1px solid rgba(128,128,128,.28);box-shadow:0 18px 48px rgba(0,0,0,.34);background:var(--card-bg,#fff)}
.site-shot__bar{display:flex;align-items:center;gap:.6rem;padding:.55rem .85rem;background:rgba(128,128,128,.16);border-bottom:1px solid rgba(128,128,128,.2)}
.site-shot__dots{display:inline-flex;gap:.4rem;flex:0 0 auto}
.site-shot__dots i{width:11px;height:11px;border-radius:50%;display:inline-block}
.site-shot__url{flex:1;text-align:center;font-size:.74rem;opacity:.72;font-family:var(--bs-font-monospace,ui-monospace,monospace);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-shot img{display:block;width:100%;height:auto;margin:0;border:0}
.site-shot__caption{max-width:640px;margin:.55rem auto 1.5rem;text-align:center;font-size:.8rem;opacity:.65}
</style>
<figure class="site-shot"><div class="site-shot__bar"><span class="site-shot__dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span><span class="site-shot__url">{{ include.url }}</span></div><img src="{{ include.src | relative_url }}" alt="{{ include.alt | strip_newlines }}" loading="lazy"></figure>{% if include.caption %}<p class="site-shot__caption">{{ include.caption }}</p>{% endif %}
