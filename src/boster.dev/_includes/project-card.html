<div class="project-card"><a class="project-card__link" href="{{ include.project.url | relative_url }}" aria-label="{{ include.project.title | strip_newlines }}"></a>{% if include.project.image %}<img class="project-card__thumb{% if include.project.image_fit %} project-card__thumb--{{ include.project.image_fit }}{% endif %}" src="{{ include.project.image | relative_url }}" alt="{{ include.project.image_alt | default: include.project.title | strip_newlines }}" loading="lazy">{% endif %}<span class="project-card__body"><span class="project-card__title" role="heading" aria-level="3">{{ include.project.title }}</span>{% if include.project.subtitle %}<span class="project-card__subtitle">{{ include.project.subtitle | strip_newlines }}</span>{% endif %}<span class="project-card__desc">{{ include.project.blurb | strip_newlines }}</span>{% if include.project.tech %}<span class="project-card__tech">{{ include.project.tech }}</span>{% endif %}</span></div>
